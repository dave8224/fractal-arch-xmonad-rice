[colors]
background = #e01a1b26
foreground = #c0caf5
blue = #7aa2f7
cyan = #7dcfff
green = #9ece6a
purple = #bb9af7
yellow = #e0af68
muted = #565f89
red = #f7768e

[bar/xmonad]
monitor = DP-0
width = 98%
height = 34
offset-x = 1%
offset-y = 8
radius = 12
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 2
font-0 = JetBrainsMono Nerd Font:size=11;2
modules-left = arch xworkspaces
modules-center = date
modules-right = cpu memory network volume power
enable-ipc = true
wm-restack = generic

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.blue}
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.cyan}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.purple}
label = %percentage_used%%

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
label-connected = "NET %local_ip%"
format-disconnected = "NET offline"

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %I:%M %p
label = %date%  %time%
label-foreground = ${colors.yellow}

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/arch]
type = custom/text
content = ""
content-foreground = ${colors.blue}
content-padding = 1
click-left = rofi -show drun

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 2

format-volume = <label-volume>
label-volume = "󰕾 %percentage%%"
label-volume-foreground = ${colors.cyan}

format-muted = <label-muted>
label-muted = "󰖁 MUTED"
label-muted-foreground = ${colors.muted}

click-right = pavucontrol

[module/power]
type = custom/text
content = "󰐥"
content-foreground = ${colors.red}
content-padding = 2
click-left = ~/.config/polybar/scripts/powermenu.sh
